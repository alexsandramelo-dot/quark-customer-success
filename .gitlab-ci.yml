stages:
  - build
  - image
  - deploy

variables:
  HARBOR_PROJECT: "quarks/cs"
  IMAGE_NAME: "${HARBOR_URL}/${HARBOR_PROJECT}/${CI_PROJECT_NAME}"

  NAMESPACE: "quarks-cs"
  DEPLOYMENT: "quark-customer-success"
  CONTAINER: "quark-customer-success"

  KUBECTL_VERSION: "v1.22.16"

  NODE_VERSION: "22"

default:
  tags:
    - docker
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# =============================================================================
# BUILD — npm ci + vite build
# =============================================================================
node:build:
  stage: build
  image:
    name: node:${NODE_VERSION}-alpine
    entrypoint: [""]
  script:
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - dist/
    when: on_success
    expire_in: 1 day
  cache:
    key: "${CI_COMMIT_REF_SLUG}-node-modules"
    paths:
      - node_modules/
    policy: pull-push
  rules:
    - if: '$CI_COMMIT_BRANCH == "producao"'

# =============================================================================
# IMAGE — docker build + push to Harbor
# =============================================================================
container:image:
  stage: image
  image: docker:19.03.13-dind
  before_script:
    - docker login --username ${HARBOR_USER} --password ${HARBOR_PASSWORD} ${HARBOR_URL}
  script:
    - |
      echo "=== Building image: ${IMAGE_NAME}:${CI_PIPELINE_ID} ==="
      docker build \
        --pull \
        --file Dockerfile \
        --tag "${IMAGE_NAME}:${CI_PIPELINE_ID}" \
        --tag "${IMAGE_NAME}:latest" \
        .
      echo "=== Pushing images ==="
      docker push "${IMAGE_NAME}:${CI_PIPELINE_ID}"
      docker push "${IMAGE_NAME}:latest"
  after_script:
    - docker image rm --force "${IMAGE_NAME}:${CI_PIPELINE_ID}" || true
    - docker image rm --force "${IMAGE_NAME}:latest" || true
  needs:
    - job: node:build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "producao"'

# =============================================================================
# DEPLOY — kubectl set image on k3s (using K3S_CREDENTIALS CI variable)
# =============================================================================
deploy:k3s:
  stage: deploy
  image:
    name: lachlanevenson/k8s-kubectl:${KUBECTL_VERSION}
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
    DEPLOY_IMAGE: "${IMAGE_NAME}:${CI_PIPELINE_ID}"
  before_script:
    - (apk add --no-cache coreutils || (apt-get update && apt-get install -y coreutils) || yum install -y coreutils) >/dev/null 2>&1
    - echo ${K3S_CREDENTIALS} | base64 -di > kubeconfig
    - export KUBECONFIG="kubeconfig"
  script:
    - kubectl set image --namespace ${NAMESPACE} deployment/${DEPLOYMENT} ${CONTAINER}=${IMAGE_NAME}:${CI_PIPELINE_ID} --record

  needs:
    - job: container:image
      artifacts: false
  environment:
    name: production
    url: "https://customer-success.quark.tec.br/quark-customer-success"
  rules:
    - if: '$CI_COMMIT_BRANCH == "producao"'
