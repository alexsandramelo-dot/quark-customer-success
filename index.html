<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quark CS</title>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var rootAlert = document.createElement('div');
        rootAlert.style.position = 'fixed';
        rootAlert.style.top = '0';
        rootAlert.style.left = '0';
        rootAlert.style.width = '100vw';
        rootAlert.style.height = '100vh';
        rootAlert.style.backgroundColor = '#0f172a';
        rootAlert.style.color = '#fecdd3';
        rootAlert.style.padding = '2rem';
        rootAlert.style.zIndex = '999999';
        rootAlert.style.fontFamily = 'monospace';
        rootAlert.style.overflow = 'auto';
        
        rootAlert.innerHTML = `
          <h1 style="color: #ef4444; font-size: 1.5rem; margin-bottom: 1rem;">[Erro Crítico de Inicialização]</h1>
          <p style="font-weight: bold; margin-bottom: 0.5rem; font-size: 1.1rem;">Mensagem: ${message}</p>
          <p style="color: #94a3b8;">Origem: ${source}:${lineno}:${colno}</p>
          ${error && error.stack ? `<pre style="background: #020617; padding: 1rem; border-radius: 0.5rem; color: #fda4af; margin-top: 1rem; overflow-x: auto;">${error.stack}</pre>` : ''}
        `;
        document.body.appendChild(rootAlert);
        return false;
      };
      window.onunhandledrejection = function(event) {
        var error = event.reason;
        var rootAlert = document.createElement('div');
        rootAlert.style.position = 'fixed';
        rootAlert.style.top = '0';
        rootAlert.style.left = '0';
        rootAlert.style.width = '100vw';
        rootAlert.style.height = '100vh';
        rootAlert.style.backgroundColor = '#0f172a';
        rootAlert.style.color = '#fecdd3';
        rootAlert.style.padding = '2rem';
        rootAlert.style.zIndex = '999999';
        rootAlert.style.fontFamily = 'monospace';
        rootAlert.style.overflow = 'auto';
        
        rootAlert.innerHTML = `
          <h1 style="color: #ef4444; font-size: 1.5rem; margin-bottom: 1rem;">[Promessa Rejeitada Não Tratada]</h1>
          <p style="font-weight: bold; margin-bottom: 0.5rem; font-size: 1.1rem;">Razão: ${error ? error.message || error : 'Desconhecida'}</p>
          ${error && error.stack ? `<pre style="background: #020617; padding: 1rem; border-radius: 0.5rem; color: #fda4af; margin-top: 1rem; overflow-x: auto;">${error.stack}</pre>` : ''}
        `;
        document.body.appendChild(rootAlert);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
